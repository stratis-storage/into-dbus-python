[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "into-dbus-python"
description = "transforms values into properly wrapped dbus-python objects"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Anne Mulhern", email = "amulhern@redhat.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "dbus-signature-pyparsing",
    "dbus-python>=1.2.10",
]
dynamic = [
    "version",
]

[project.readme]
file = "README.rst"
content-type = "text/x-rst"

[project.urls]
Homepage = "https://github.com/stratis-storage/into-dbus-python"

[tool.setuptools]
packages = [
    "into_dbus_python",
]
platforms = [
    "Linux",
]
include-package-data = false

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.dynamic.version]
attr = "into_dbus_python._version.__version__"

[tool.pyright]

[[tool.pyright.executionEnvironments]]
root = "tests/test_hypothesis.py"
reportAttributeAccessIssue = false
reportCallIssue = false
reportArgumentType = false

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "F", "PL"]

[tool.ruff.lint.isort]
known-first-party = ["dbus_signature_pyparsing", "hs_dbus_signature"]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true
